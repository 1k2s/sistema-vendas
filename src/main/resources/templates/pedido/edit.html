<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar-geral}"></div>
<div class="container mt-4">
    <h2 th:text="'Pedido nº ' + ${pedido.id}"></h2>

    <div class="alert alert-danger" th:if="${erro != null}">
        <span th:text="${erro}"></span>
    </div>

    <table class="table table-bordered w-auto">
        <tr>
            <th>Cliente</th>
            <td th:text="${pedido.cliente.nome}"></td>
        </tr>
        <tr>
            <th>Data</th>
            <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        <tr>
            <th>Status</th>
            <td th:text="${pedido.status}"></td>
        </tr>
        <tr>
            <th>Versão</th>
            <td th:text="${pedido.version}"></td>
        </tr>
    </table>

    <h4 class="mt-4">Adicionar item</h4>
    <form class="row g-2 align-items-end mb-4" th:action="@{/pedidos/{id}/adicionar-item(id=${pedido.id})}" method="post">
        <div class="col-md-6">
            <label for="produtoId" class="form-label">Produto</label>
            <select class="form-select" id="produtoId" name="produtoId" required>
                <option value="">Selecione o produto</option>
                <option th:each="produto : ${produtos}"
                        th:value="${produto.id}"
                        th:disabled="${produto.quantidadeEmEstoque <= 0}"
                        th:text="${produto.nome + ' - R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA') + ' (estoque: ' + produto.quantidadeEmEstoque + ')'}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label for="quantidade" class="form-label">Quantidade</label>
            <input type="number" class="form-control" id="quantidade" name="quantidade" min="1" value="1" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-success w-100">Adicionar</button>
        </div>
    </form>

    <h4>Itens do pedido</h4>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço Unitário</th>
            <th>Subtotal</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${pedido.itens}">
            <td th:text="${item.produto.nome}"></td>
            <td th:text="${item.quantidade}"></td>
            <td th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
            <td th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario * item.quantidade, 1, 'POINT', 2, 'COMMA')}"></td>
            <td>
                <form th:action="@{/pedidos/{pedidoId}/remover-item/{itemId}(pedidoId=${pedido.id}, itemId=${item.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-danger">Remover</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pedido.itens)}">
            <td colspan="5" class="text-center">Nenhum item adicionado.</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="text-end">Valor Total</th>
            <th colspan="2" th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></th>
        </tr>
        </tfoot>
    </table>

    <div class="d-flex gap-2">
        <form th:action="@{/pedidos/{id}/finalizar(id=${pedido.id})}" method="post">
            <button type="submit" class="btn btn-primary">Finalizar Pedido</button>
        </form>
        <a class="btn btn-danger" th:href="@{/pedidos/cancelar/{id}(id=${pedido.id})}">Cancelar Pedido</a>
        <a class="btn btn-secondary" th:href="@{/pedidos}">Voltar</a>
    </div>
</div>
</body>
</html>
